<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>مواقيت الصلاة - دمنهور</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
body { background: #1e293b; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }

.card {
background-color: #c7d2fe;
border: 3px solid #c7d2fe;
border-radius: 16px;
width: 100%;
max-width: 400px;
overflow: hidden;
display: grid;
grid-template-columns: repeat(6, 1fr);
gap: 2px;
box-shadow: 0 10px 20px rgba(0,0,0,0.3);
}

.cell { background-color: #ffffff; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 10px 5px; }
.half-width { grid-column: span 3; }
.third-width { grid-column: span 2; }

.year-cell { padding: 12px 0; font-weight: bold; font-size: 18px; color: #1e293b; background-color: #f8fafc; }
.month-cell { font-weight: bold; font-size: 16px; color: #0f172a; }
.day-cell { font-size: 32px; font-weight: bold; color: #4f46e5; background-color: #eef2ff; padding: 8px; }

.prayer-name { font-size: 13px; color: #4f46e5; font-weight: bold; margin-bottom: 5px; }
.prayer-time { font-size: 16px; color: #334155; font-weight: bold; direction: ltr; }

.location-bar { grid-column: span 6; background-color: #f8fafc; font-size: 12px; color: #64748b; padding: 8px; text-align: center; font-weight: bold; }
.next-prayer-box { grid-column: span 6; background-color: #f8fafc; font-size: 13px; padding: 10px; text-align: center; font-weight: bold; display: flex; justify-content: center; gap: 10px; }
.next-prayer-text { color: #4f46e5; }
.countdown-text { color: #ef4444; direction: ltr; font-size: 15px;}
</style>
</head>
<body>
<div class="card">
<div class="cell half-width year-cell" id="gregYear">----</div>
<div class="cell half-width year-cell" id="hijriYear">----</div>
<div class="cell half-width month-cell" id="gregMonth">----</div>
<div class="cell half-width month-cell" id="hijriMonth">----</div>
<div class="cell half-width day-cell" id="gregDay">--</div>
<div class="cell half-width day-cell" id="hijriDay">--</div>

<div class="cell third-width"><div class="prayer-name">الفجر</div><div class="prayer-time" id="fajr">--:--</div></div>
<div class="cell third-width"><div class="prayer-name">الشروق</div><div class="prayer-time" id="sunrise">--:--</div></div>
<div class="cell third-width"><div class="prayer-name">الظهر</div><div class="prayer-time" id="dhuhr">--:--</div></div>
<div class="cell third-width"><div class="prayer-name">العصر</div><div class="prayer-time" id="asr">--:--</div></div>
<div class="cell third-width"><div class="prayer-name">المغرب</div><div class="prayer-time" id="maghrib">--:--</div></div>
<div class="cell third-width"><div class="prayer-name">العشاء</div><div class="prayer-time" id="isha">--:--</div></div>

<div class="location-bar">دمنهور، البحيرة (طريقة الأزهر الشريف)</div>

<div class="next-prayer-box">
<span class="next-prayer-text">الصلاة القادمة: <span id="nextPrayerName">---</span></span>
<span class="next-prayer-text">متبقي: <span class="countdown-text" id="countdown">--:--:--</span></span>
</div>
</div>

<script>
function formatTime12h(time24) {
if (!time24) return '--:--';
let [hours, minutes] = time24.split(':');
let h = parseInt(hours, 10);
h = h % 12; h = h ? h : 12;
return ${h}:${minutes};
}

let globalPrayerTimes = {};

function updateGregorianDate() {
const now = new Date();
document.getElementById('gregYear').textContent = now.getFullYear();
document.getElementById('gregMonth').textContent = now.toLocaleDateString('ar-EG', { month: 'long' });
document.getElementById('gregDay').textContent = now.getDate();
}

function updateUI(data) {
const timings = data.timings;
const hijri = data.hijri;
document.getElementById('hijriYear').textContent = hijri.year;
document.getElementById('hijriMonth').textContent = hijri.month.ar;
document.getElementById('hijriDay').textContent = hijri.day;
document.getElementById('fajr').textContent = formatTime12h(timings.Fajr);
document.getElementById('sunrise').textContent = formatTime12h(timings.Sunrise);
document.getElementById('dhuhr').textContent = formatTime12h(timings.Dhuhr);
document.getElementById('asr').textContent = formatTime12h(timings.Asr);
document.getElementById('maghrib').textContent = formatTime12h(timings.Maghrib);
document.getElementById('isha').textContent = formatTime12h(timings.Isha);

globalPrayerTimes = {
"الفجر": timings.Fajr, "الشروق": timings.Sunrise, "الظهر": timings.Dhuhr,
"العصر": timings.Asr, "المغرب": timings.Maghrib, "العشاء": timings.Isha
};
}

async function fetchData() {
// إحداثيات دمنهور: 31.0341, 30.4682
const url = 'https://api.aladhan.com/v1/timingsByCity?city=Damanhour&country=Egypt&method=5&language=ar';
try {
const response = await fetch(url + '&_=' + Date.now());
const data = await response.json();
const payload = { timings: data.data.timings, hijri: data.data.date.hijri };
localStorage.setItem('prayerDataDamanhour', JSON.stringify(payload));
localStorage.setItem('lastFetchDamanhour', new Date().toDateString());
updateUI(payload);
} catch (error) {
console.warn("Fetch failed", error);
}
}

function updateCountdown() {
if (Object.keys(globalPrayerTimes).length === 0) return;
const now = new Date();
let nextPrayer = null;
let nextTime = null;

const timesList = Object.keys(globalPrayerTimes).map(name => {
let t = globalPrayerTimes[name].split(' ')[0];
let dt = new Date(${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}T${t}:00);
return { name, time: dt };
}).sort((a, b) => a.time - b.time);

for (let p of timesList) {
if (p.time > now) { nextPrayer = p.name; nextTime = p.time; break; }
}

if (!nextPrayer) {
nextPrayer = timesList[0].name;
nextTime = new Date(timesList[0].time.getTime() + 24 * 60 * 60 * 1000);
}

const diff = nextTime - now;
const h = Math.floor(diff / 3600000).toString().padStart(2, '0');
const m = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
const s = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');

document.getElementById('nextPrayerName').textContent = nextPrayer;
document.getElementById('countdown').textContent = ${h}:${m}:${s};
}

function refreshAll() {
updateGregorianDate();
try {
const savedData = localStorage.getItem('prayerDataDamanhour');
if (savedData) updateUI(JSON.parse(savedData));
} catch (e) {}
const lastFetch = localStorage.getItem('lastFetchDamanhour');
if (lastFetch !== new Date().toDateString()) fetchData();
}

setInterval(updateCountdown, 1000);
setInterval(updateGregorianDate, 60000);
setInterval(() => { if (new Date().getMinutes() === 0) fetchData(); }, 60000);
window.addEventListener('focus', refreshAll);
refreshAll();
</script>
</body>
</html>
